<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8B1E3F">
    <title>Restaurantes — Messapi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body class="public-page">

    <header class="app-header">
        <div class="app-header__inner">
            <a href="public.html" class="app-header__logo">
                <span class="logo-mark"></span>
                <span class="logo-text">Messapi</span>
            </a>

            <div class="app-header__actions">
                <button type="button" class="icon-btn" id="search-toggle" aria-label="Buscar">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
                        <path d="m20 20-3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>

                <a href="index.html" class="icon-btn" id="nav-login" aria-label="Iniciar sesión">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path d="M15 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M10 17l-5-5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5 12h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </a>

                <a href="home.html" class="icon-btn" id="nav-back" hidden aria-label="Volver al panel">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
                    </svg>
                </a>
            </div>
        </div>

        <div class="search-panel" id="search-panel" hidden>
            <div class="search-panel__inner">
                <span class="search-panel__icon">🔍</span>
                <input type="text" id="search-input"
                       placeholder="Buscar restaurante..."
                       autocomplete="off"
                       inputmode="search">
                <button type="button" class="search-panel__close" id="search-close" aria-label="Cerrar">✕</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero__inner">
            <p class="hero__eyebrow">Crespo, E.R</p>
            <h1 class="hero__title">Encontrá tu mesa perfecta</h1>
            <p class="hero__subtitle">
                Consultá en tiempo real la disponibilidad de mesas.
            </p>
        </div>
    </section>

    <main class="public-main">

        <div id="loading" class="state-block">
            <div class="spinner"></div>
            <p>Cargando restaurantes...</p>
        </div>

        <div id="error-box" class="state-block state-block--error" hidden>
            <p id="error-message">Ocurrió un error.</p>
            <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>
        </div>

        <div id="empty-box" class="state-block" hidden>
            <div class="empty-icon">🍽️</div>
            <p id="empty-message">No hay restaurantes registrados todavía.</p>
        </div>

        <section id="restaurants-list" class="restaurants-list" hidden></section>

    </main>

    <button id="back-to-top" class="back-to-top" aria-label="Volver arriba">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"
                  fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <footer class="app-footer">
        <p>&copy; 2026 Messapi</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/utils/session.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/services/client.js"></script>
    <script src="js/services/public.js"></script>
    <script>
        // Header: mostrar "Login" o "Volver al panel" según sesión.
        (function () {
            const backBtn  = document.getElementById('nav-back');
            const loginBtn = document.getElementById('nav-login');
            if (!backBtn || !loginBtn) return;

            if (Session.isLogged()) {
                backBtn.hidden = false;
                loginBtn.hidden = true;
            } else {
                backBtn.hidden = true;
                loginBtn.hidden = false;
            }
        })();
    </script>
    <script src="js/pages/public.js"></script>
</body>
</html>
